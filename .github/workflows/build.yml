name: Build ImmortalWrt for Netcore N30 Pro

on:
  push:
    branches: [master]
    paths:
      - 'target/linux/mediatek/**'
      - 'package/custom/**'
      - 'package/libs/**'
      - 'files/**'
      - 'ci/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      REF:
        description: Git ref (branch/tag/sha) to build
        required: false
        default: master

concurrency:
  group: n30pro-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ImmortalWrt (MT7981B / netis_nx30v2)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      TARGET: mediatek/filogic
      PROFILE: netis_nx30v2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.inputs.REF || github.ref }}

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential clang flex bison g++ gawk             gcc-multilib g++-multilib gettext git ncurses-dev             libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
          sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*

      - name: Prepare feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config for N30 Pro
        run: |
          set -eo pipefail
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netis_nx30v2=y
          CONFIG_PACKAGE_kmod-mii=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-eem=y
          CONFIG_PACKAGE_usb-vbus=y
          CONFIG_PACKAGE_ttlfix=y
          CONFIG_PACKAGE_usbwan-watchdog=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_curl=y
          CONFIG_SSTRIP=y
          # CONFIG_ALL is not set
          # CONFIG_ALL_KMODS is not set
          # CONFIG_ALL_NONSHARED is not set
          EOF

          # defconfig 宽容：上游 qt5base/fwknopd/squeezelite 的 Kconfig 递归依赖只会告警，
          # 仍会写出与 Kconfig 同步的 .config。跑两次让选择收敛。
          make defconfig
          make defconfig

          # olddefconfig 对上游递归依赖是严格模式（会非零退出），但此时 .config 已由 defconfig 写同步，
          # 失败不应该让 CI 挂掉；记录下来但不传播退出码。
          if ! make olddefconfig; then
            echo "::warning::olddefconfig returned non-zero due to upstream recursive Kconfig deps; .config was already synced by defconfig"
          fi

          echo '=== target/profile ==='
          grep -E '^CONFIG_TARGET' .config | sort
          echo '=== usb/custom packages ==='
          grep -E '^CONFIG_PACKAGE_(kmod-mii|kmod-usb3|kmod-usb-net|kmod-usb-net-cdc-ether|kmod-usb-net-rndis|kmod-usb-net-cdc-ncm|kmod-usb-net-cdc-eem|usb-vbus|ttlfix|usbwan-watchdog|nftables|curl)=' .config | sort

          echo '=== assert required packages enabled ==='
          missing=0
          for p in kmod-usb3 kmod-usb-net kmod-usb-net-rndis kmod-usb-net-cdc-ether usb-vbus ttlfix usbwan-watchdog; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "  OK   ${p}"
            else
              echo "  MISS $p"; missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo 'ERROR: required packages missing from .config'; exit 1; }
          echo '.config OK'

      - name: Build firmware
        run: |
          set -o pipefail
          echo '=== free disk ==='
          df -h . && nproc
          echo '=== start make ==='
          make -j$(nproc) 2>&1 | tee build.log

      - name: Diagnose failing package (on failure)
        if: failure()
        run: |
          echo '=== recompile libffi verbosely ==='
          make -C package/libs/libffi compile V=s 2>&1 | tail -150 || true
          echo '=== libffi build_dir tree ==='
          find build_dir -maxdepth 4 -name 'fficonfig.h' 2>/dev/null || true
          ls -la build_dir/target-*/libffi-*/ 2>/dev/null | head -40 || true
          echo '=== tail build.log ==='
          tail -120 build.log || true

      - name: Verify firmware + sha256
        run: |
          echo "=== bin/targets/mediatek/filogic/ ==="
          ls -la bin/targets/mediatek/filogic/ || true
          echo "=== sha256 ==="
          cd bin/targets/mediatek/filogic/ && sha256sum *.itb *.bin 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n30pro-firmware
          path: |
            bin/targets/mediatek/filogic/**/*.itb
            bin/targets/mediatek/filogic/**/*.bin
            bin/targets/mediatek/filogic/**/*.img
            bin/targets/mediatek/filogic/**/*.fit
            build.log
            .config
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
