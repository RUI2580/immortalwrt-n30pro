name: Build ImmortalWrt for Netcore N30 Pro

on:
  push:
    branches: [master]
    paths:
      - 'target/linux/mediatek/**'
      - 'package/custom/**'
      - 'files/**'
      - 'ci/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      REF:
        description: Git ref (branch/tag/sha) to build
        required: false
        default: master

concurrency:
  group: n30pro-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ImmortalWrt (MT7981B / netis_nx30v2)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      TARGET: mediatek/filogic
      PROFILE: netis_nx30v2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.inputs.REF || github.ref }}

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential clang flex bison g++ gawk             gcc-multilib g++-multilib gettext git ncurses-dev             libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
          sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*

      - name: Prepare feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config for N30 Pro
        run: |
          # Step 1: defconfig (only target + profile, no custom packages)
          echo "CONFIG_TARGET=\"mediatek/filogic\"" > .config
          echo "CONFIG_TARGET_PROFILES_netis_nx30v2=y" >> .config
          make defconfig

          # Step 2: append USB Tethering + custom packages
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-mii=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-eem=y
          CONFIG_PACKAGE_usb-vbus=y
          CONFIG_PACKAGE_ttlfix=y
          CONFIG_PACKAGE_usbwan-watchdog=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_curl=y
          CONFIG_ALL_NONSHARED=y
          CONFIG_ALL_KMODS=y
          # CONFIG_ALL is not set
          # CONFIG_STRIP_ALL is not set
          CONFIG_SSTRIP=y
          EOF

          # Step 3: olddefconfig resolves dependencies (no interactive fallback)
          make olddefconfig 2>&1 | tail -30

          echo "=== final .config (USB/TARGET/CUSTOM) ==="
          grep -E '^(CONFIG_TARGET=|CONFIG_TARGET_PROFILES_netis|CONFIG_PACKAGE_kmod-usb|CONFIG_PACKAGE_kmod-mii|CONFIG_PACKAGE_usb-vbus|CONFIG_PACKAGE_ttlfix|CONFIG_PACKAGE_usbwan|CONFIG_PACKAGE_nftables|CONFIG_PACKAGE_curl)' .config | sort

      - name: Build firmware
        run: |
          echo "=== free disk ==="
          df -h . && nproc
          echo "=== start make ==="
          make -j$(nproc) 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          if [ $RC -ne 0 ]; then
            echo "=== make FAILED RC=$RC, retrying with -j1 V=s ==="
            tail -200 build.log
            make -j1 V=s 2>&1 | tee build-retry.log
            exit ${PIPESTATUS[0]}
          fi

      - name: Verify firmware + sha256
        run: |
          echo "=== bin/targets/mediatek/filogic/ ==="
          ls -la bin/targets/mediatek/filogic/ || true
          echo "=== sha256 ==="
          cd bin/targets/mediatek/filogic/ && sha256sum *.itb *.bin 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n30pro-firmware
          path: |
            bin/targets/mediatek/filogic/**/*.itb
            bin/targets/mediatek/filogic/**/*.bin
            bin/targets/mediatek/filogic/**/*.img
            bin/targets/mediatek/filogic/**/*.fit
            build.log
            build-retry.log
            .config
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
