
name: Build ImmortalWrt for Netcore N30 Pro

on:
  push:
    branches: [master]
    paths:
      - 'target/linux/mediatek/**'
      - 'package/custom/**'
      - 'files/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      REF:
        description: Git ref (branch/tag/sha) to build
        required: false
        default: master

concurrency:
  group: n30pro-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ImmortalWrt (MT7981B / netis_nx30v2)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      TARGET: mediatek/filogic
      PROFILE: netis_nx30v2
      FIRMWARE_NAME: openwrt-mediatek-filogic-netis_nx30v2-squashfs-sysupgrade.itb

    steps:
      - name: Checkout ImmortalWrt source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.inputs.REF || github.ref }}

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential clang flex bison g++ gawk             gcc-multilib g++-multilib gettext git ncurses-dev             libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
          sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*

      - name: Prepare feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config for N30 Pro
        run: |
          # 1. Select target + subtarget
          ./scripts/config --set-str CONFIG_TARGET mediatek/filogic

          # 2. Enable the N30 Pro profile (Netcore N30 Pro = netis_nx30v2)
          ./scripts/config --enable CONFIG_TARGET_PROFILES_netis_nx30v2

          # 3. Core USB Tethering kernel modules (kmod-mii + kmod-usb-net stack)
          ./scripts/config --enable CONFIG_PACKAGE_kmod-mii
          ./scripts/config --enable CONFIG_PACKAGE_kmod-usb3
          ./scripts/config --enable CONFIG_PACKAGE_kmod-usb-net
          ./scripts/config --enable CONFIG_PACKAGE_kmod-usb-net-cdc-ether
          ./scripts/config --enable CONFIG_PACKAGE_kmod-usb-net-cdc-ncm
          ./scripts/config --enable CONFIG_PACKAGE_kmod-usb-net-cdc-eem
          ./scripts/config --enable CONFIG_PACKAGE_kmod-usb-net-rndis

          # 4. Custom packages from package/custom/
          ./scripts/config --enable CONFIG_PACKAGE_usb-vbus
          ./scripts/config --enable CONFIG_PACKAGE_ttlfix
          ./scripts/config --enable CONFIG_PACKAGE_usbwan-watchdog

          # 5. Dependencies our custom packages need
          ./scripts/config --enable CONFIG_PACKAGE_nftables
          ./scripts/config --enable CONFIG_PACKAGE_ping6
          ./scripts/config --enable CONFIG_PACKAGE_curl

          # 6. Standard build options
          ./scripts/config --enable CONFIG_ALL_NONSHARED
          ./scripts/config --enable CONFIG_ALL_KMODS
          ./scripts/config --disable CONFIG_ALL
          ./scripts/config --disable CONFIG_STRIP_ALL
          ./scripts/config --enable CONFIG_SSTRIP

          # Apply + auto-fill defaults for everything else
          make defconfig

          echo "=== final .config (USB/TARGET/CUSTOM) ==="
          grep -E '^(CONFIG_TARGET=|CONFIG_TARGET_subtarget|CONFIG_TARGET_PROFILES_netis|CONFIG_PACKAGE_kmod-usb|CONFIG_PACKAGE_kmod-mii|CONFIG_PACKAGE_usb-vbus|CONFIG_PACKAGE_ttlfix|CONFIG_PACKAGE_usbwan|CONFIG_PACKAGE_nftables|CONFIG_PACKAGE_ping6|CONFIG_PACKAGE_curl)' .config | sort

      - name: Build firmware
        run: |
          echo "=== free disk space ==="
          df -h .
          nproc
          echo "=== start make ==="
          make -j$(nproc) 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          if [ $RC -ne 0 ]; then
            echo "=== make FAILED RC=$RC ==="
            tail -200 build.log
            make -j1 V=s 2>&1 | tee build-retry.log
            exit ${PIPESTATUS[0]}
          fi

      - name: Verify firmware output
        run: |
          echo "=== bin/targets/mediatek/filogic/ ==="
          ls -la bin/targets/mediatek/filogic/ || true
          echo "=== find .itb / .bin ==="
          find bin/ -maxdepth 5 \( -name '*.itb' -o -name '*.bin' -o -name '*.img' -o -name '*.fit' \) 2>/dev/null
          echo "=== sha256 ==="
          cd bin/targets/mediatek/filogic/ && sha256sum *.itb *.bin 2>/dev/null || true

      - name: Upload firmware + build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n30pro-firmware
          path: |
            bin/targets/mediatek/filogic/**/*.itb
            bin/targets/mediatek/filogic/**/*.bin
            bin/targets/mediatek/filogic/**/*.img
            bin/targets/mediatek/filogic/**/*.fit
            build.log
            build-retry.log
            .config
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
