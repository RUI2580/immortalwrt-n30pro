name: U-Boot check (fast)

on:
  workflow_dispatch:

jobs:
  uboot:
    name: Compile U-Boot only for netcore_n30pro
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git ncurses-dev \
            libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Prepare feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config
        run: |
          printf 'CONFIG_TARGET_mediatek=y\nCONFIG_TARGET_mediatek_filogic=y\nCONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30pro=y\nCONFIG_SSTRIP=y\n' > .config
          make defconfig || true
          make defconfig || true
          echo '=== .config size ==='
          wc -l .config
          echo '=== TOPDIR check ==='
          grep -q 'CONFIG_TARGET_mediatek' .config && echo 'config has target' || { echo 'ERROR: no target in .config'; exit 1; }

      - name: Prepare toolchain dirs (needed for package builds)
        run: |
          echo '=== building tools ==='
          make tools/compile -j$(nproc) 2>&1 | tail -20 || true
          echo '=== after tools ==='
          ls -d staging_dir/toolchain-* 2>/dev/null || echo 'no toolchain yet'

      - name: Compile U-Boot verbose
        run: |
          set -o pipefail
          make -C package/boot/uboot-mediatek compile V=s 2>&1 | tail -200

      - name: Show results
        if: always()
        run: |
          echo '=== staging image dir ==='
          ls -la staging_dir/target-*/image/ 2>/dev/null | grep -iE 'fip|n30pro' || echo 'none'
          echo '=== build_dir ==='
          find build_dir -maxdepth 4 -name '*netcore_n30pro*' 2>/dev/null || echo 'none'