name: U-Boot check (fast)

on:
  workflow_dispatch:

jobs:
  uboot:
    name: Compile U-Boot only for netcore_n30pro
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git ncurses-dev \
            libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Prepare feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config
        run: |
          set -eo pipefail
          printf 'CONFIG_TARGET_mediatek=y\nCONFIG_TARGET_mediatek_filogic=y\nCONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30pro=y\nCONFIG_SSTRIP=y\n' > .config
          make defconfig || true
          make defconfig || true
          make olddefconfig || true

      - name: Show U-Boot patch in tree
        run: |
          echo '=== patches dir ==='
          ls -la package/boot/uboot-mediatek/patches/ | grep -E '505|468' || true
          echo '=== 505 patch head ==='
          head -6 package/boot/uboot-mediatek/patches/505-add-netcore-n30pro.patch || true

      - name: Compile U-Boot verbose
        run: |
          set -o pipefail
          make -C package/boot/uboot-mediatek compile V=s 2>&1 | tail -200

      - name: Verify generated fip
        run: |
          echo '=== stagin_dir images ==='
          ls -la staging_dir/target-*/image/ 2>/dev/null | grep -iE 'fip|n30pro' || true
          echo '=== build_dir uboot ==='
          find build_dir -maxdepth 3 -name '*netcore_n30pro*' 2>/dev/null || true